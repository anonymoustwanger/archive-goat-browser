# Builds Goat's Chromium (ungoogled-chromium + Goat branding and patches) for
# Windows x64 on GitHub's free runners. A full build takes about a day, so it is
# split into up to 16 stages of ~5 hours; each stage saves its progress for the
# next. The result is published as a pre-release "base-<chromium version>" that
# the Goat release workflow (goat-release.yml) packages into the installer.
#
# Run it from the Actions tab: "Chromium base" > Run workflow. Only needed when
# Chromium itself or files in chromium/patches, brand.py or hook.py change.
# The repository must be public (private repos don't get enough free minutes).
name: Chromium base

on:
  workflow_dispatch:
    inputs:
      ucw_ref:
        description: ungoogled-chromium-windows tag to build (Chromium version)
        required: true
        default: '157.0.8103.50-1.1'

permissions:
  contents: write
  actions: write

concurrency:
  group: chromium-base
  cancel-in-progress: false

env:
  UCW_REF: ${{ inputs.ucw_ref }}

jobs:
  build-1:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Get ungoogled-chromium-windows
        uses: actions/checkout@v7
        with:
          repository: ungoogled-software/ungoogled-chromium-windows
          ref: ${{ env.UCW_REF }}
          submodules: recursive
      - name: Get Goat
        uses: actions/checkout@v7
        with:
          path: goat-src
          sparse-checkout: chromium
      - name: Add Goat to the build
        run: python goat-src/chromium/hook.py .
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Install Pillow (icons)
        run: python -m pip install pillow
      - name: Build (stage 1)
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-2:
    needs: build-1
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Get ungoogled-chromium-windows
