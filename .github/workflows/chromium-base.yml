      finished: ${{ steps.stage.outputs.finished }}

  publish:
    needs: build-16
    runs-on: ubuntu-latest
    steps:
      - name: Check the build finished
        run: |
          if [ "${{ needs.build-16.outputs.finished }}" != "true" ]; then
            echo "The build did not finish in 16 stages."; exit 1
          fi
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: chromium
          path: base
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la base
          installer=$(ls base/*_installer_x64.exe | head -1)
          version=$(basename "$installer" | sed -E 's/^ungoogled-chromium_([0-9.]+-[0-9.]+)_.*/\1/')
          mv "$installer" base/goat-chromium-installer.exe
          zip=$(ls base/*_windows_x64.zip | head -1)
          mv "$zip" base/goat-chromium-windows.zip
          tag="base-$version"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Chromium base $version" \
            --notes "Goat's Chromium $version (ungoogled-chromium with Goat branding). Used by the Goat release workflow; download Goat itself from the latest release." \
            base/goat-chromium-installer.exe base/goat-chromium-windows.zip
