# Builds only GoatBrowserSetup.exe (the installer with the version list) when it
# changes, so it can be tried without making a release. Download it from the
# run's "Artifacts".
name: Goat installer

on:
  push:
    branches: [main]
    paths: ['chromium/installer/**', '.github/workflows/goat-installer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: pwsh
        run: chromium/installer/build-setup.ps1 -Out "$env:RUNNER_TEMP\out"
      - uses: actions/upload-artifact@v7
        with:
          name: GoatBrowserSetup
          path: ${{ runner.temp }}\out\GoatBrowserSetup.exe
