<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tor window</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { width: min(440px, 100%); text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 22px; margin: 12px 0 4px; color: var(--tor); }
    .bar { margin: 18px 0 8px; height: 6px; }
    p { margin: 6px 0; }
  </style>
</head>
<body>
  <main>
    <img src="icons/128.png" alt="">
    <h1>Tor window</h1>
    <p class="muted">Everything in this window goes through Tor. Nothing is saved after you close it.</p>
    <div class="bar"><i id="bar"></i></div>
    <p id="status">Starting Tor…</p>
  </main>
  <script type="module" src="tor.js"></script>
</body>
</html>
