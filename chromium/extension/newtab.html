<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New tab</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: flex; justify-content: center; padding: 18vh 16px 40px; }
    main { width: min(640px, 100%); }
    h1 { text-align: center; font-size: 64px; margin: 0 0 22px; }
    .note { border: 1px solid var(--tor); color: var(--tor); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
    form input { width: 100%; padding: 14px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 16px; outline: none; }
    form input:focus { border-color: var(--muted); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 28px; }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; text-decoration: none; border: 1px solid transparent; background: none; cursor: pointer; }
    .tile:hover { background: var(--card); border-color: var(--line); }
    .ticon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
    .ticon img { width: 24px; height: 24px; }
    .tlabel { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 12px; }
    .folder header { display: flex; justify-content: space-between; align-items: center; }
    .folder header button { border: 0; background: none; font-size: 18px; padding: 2px 8px; }
    .facts { margin: 36px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 class="mark">goat</h1>
    <p class="note" id="tornote" hidden><b>Tor window.</b> Everything here goes through Tor and is deleted when you close the window. Sites can't see your IP address.</p>
    <form id="search"><input id="q" placeholder="Search or enter address" autocomplete="off" spellcheck="false" autofocus aria-label="Search"></form>
    <div class="tiles" id="tiles"></div>
    <div class="folder" id="folder" hidden><header><b id="foldername"></b><button id="folderclose" aria-label="Close folder">×</button></header><div class="tiles" id="foldertiles"></div></div>
    <ul class="facts">
      <li><b>Ads & trackers blocked</b> by uBlock Origin Lite.</li>
      <li><b>Fingerprint shield on.</b> Change it in <a href="settings.html">Goat settings</a>.</li>
      <li><b>Tor and translation</b> are on Goat's toolbar button.</li>
    </ul>
  </main>
  <script type="module" src="newtab.js"></script>
</body>
</html>
