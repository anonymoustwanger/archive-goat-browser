<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Goat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 320px; padding: 12px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    header img { width: 22px; height: 22px; }
    header .mark { font-size: 18px; flex: 1; }
    section { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    section h2 { font-size: 13px; margin: 0 0 2px; }
    section p { margin: 2px 0 0; font-size: 12px; }
    .tor h2 { color: var(--tor); }
    .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 6px 8px; font-size: 13px; }
    .bar { margin-top: 8px; }
    .update { border-color: var(--ok); }
    footer { display: flex; gap: 6px; }
    footer button { flex: 1; font-size: 13px; padding: 6px 8px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <span class="mark">goat</span>
    <span class="muted" id="version"></span>
  </header>

  <section class="tor" id="torwin" hidden>
    <h2>Tor window</h2>
    <p class="muted" id="torwinText">Everything in this window goes through Tor. Nothing is saved after you close it.</p>
    <div class="bar" id="torwinBar" hidden><i></i></div>
    <div class="actions"><button id="circuit2">New circuit</button></div>
  </section>

  <section class="tor" id="tor">
    <div class="row">
      <div class="grow">
        <h2>Tor</h2>
        <p class="muted" id="torText">Send this browser's traffic through Tor.</p>
      </div>
      <label class="switch" title="Tor for normal windows"><input type="checkbox" id="torToggle"><span></span></label>
    </div>
    <div class="bar" id="torBar" hidden><i></i></div>
    <div class="actions">
      <button id="torWindow">New Tor window</button>
      <button id="circuit" hidden>New circuit</button>
    </div>
  </section>

  <section id="tr">
    <h2>Translate</h2>
    <p class="muted" id="trText">Translate this page.</p>
    <div class="actions">
      <button id="translate" class="primary">Translate</button>
      <button id="original" hidden>Show original</button>
    </div>
  </section>

  <section class="update" id="update" hidden>
    <h2 class="ok">Update ready</h2>
    <p class="muted" id="updateText"></p>
    <div class="actions"><button id="getUpdate" class="primary">Download update</button></div>
  </section>

  <footer>
    <button id="settings">Settings</button>
    <button id="privateWin">Private window</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
